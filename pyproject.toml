[project]
name = "vision-foundation-model-feasibility"
version = "0.1.0"
description = "In this repo we will explore the feasibility of using vision foundation models for quality control in industrial applications."
readme = "README.md"
authors = [
    { name = "imran-git-000", email = "imran.chouybat1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

# optional grouped dependencies that are installed only when explicitly requested
[project.optional-dependencies]

data = [
    # "polars==1.13.1"
]


# dev dependencies are installed during development but no for package
[dependency-groups]

# dependencies needed to lint and run tests
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-xdist[psutil]",
    "ruff",
    "ty",
]


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
